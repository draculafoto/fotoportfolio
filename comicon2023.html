
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Photo Portfolio</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --subtext-color: #a0a0a0;
      --accent-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header & Navigation Styling */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    header p {
      color: var(--subtext-color);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Top Navigation Menu */
    nav {
      margin-top: 1.5rem;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 1rem 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--subtext-color);
      text-decoration: none;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
      padding: 0.5rem 0;
    }

    nav a:hover,
    nav a.active {
      color: var(--text-color);
      border-bottom: 2px solid var(--text-color);
    }

    /* Uniform Square Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background-color: #1e1e1e;
      cursor: pointer;
    }

     .gallery-item img {
     width: 100%;
     height: 100%;
     object-fit: cover;
     object-position: top center;
     display: block;

    /* Ensures images are COLOR by default */
     filter: grayscale(0%);
  
    /* Added filter to the transition list for smooth animation */
     transition: transform 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
    }

   /* Find and update this block in your CSS */
   .gallery-item:hover img {
    transform: scale(1.05);
    opacity: 0.9;
  
    /* NEW: Turns the image BLACK AND WHITE when hovered over */
    filter: grayscale(100%);
    }
 

    /* Full-Screen Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 300;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: var(--subtext-color);
    }

    /* Custom Zoom Utilities - This is for each image to have a pecial zoom if needed 01 */
.gallery-item.zoom-sm img {
  transform: scale(1.15); /* Slight extra zoom */
}

.gallery-item.zoom-md img {
  transform: scale(1.3);  /* Medium extra zoom */
}

.gallery-item.zoom-lg img {
  transform: scale(1.5);  /* Deep zoom */
}

/* Adjust hover effect so zoomed images still animate on hover */
.gallery-item.zoom-sm:hover img {
  transform: scale(1.2);
  filter: grayscale(100%);
}

.gallery-item.zoom-md:hover img {
  transform: scale(1.35);
  filter: grayscale(100%);
}

.gallery-item.zoom-lg:hover img {
  transform: scale(1.55);
  filter: grayscale(100%);
}

/* /Custom Zoom Utilities - This is for each image to have a pecial zoom if needed 01 */


    
    /* Footer */
    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #222;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const galleryItems = document.querySelectorAll('.gallery-item img');

    galleryItems.forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('active');
      });
    });

    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        lightbox.classList.remove('active');
      }
    });
  </script>
