<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Portfolio</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --subtext-color: #a0a0a0;
      --accent-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header styling */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    header p {
      color: var(--subtext-color);
      font-size: 1rem;
    }

    /* Uniform Square Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      position: relative;
      width: 100%;
      /* Forces exact 1:1 square ratio for every container */
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background-color: #1e1e1e;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      /* Fills the square without distorting proportions */
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* Full-Screen Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 300;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: var(--subtext-color);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #222;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Your Name</h1>
    <p>Photography & Visual Stories</p>
  </header>

  <main class="gallery">
    <!-- Replace the src links below with your own images (e.g., images/photo1.jpg) -->
    <div class="gallery-item">
      <img src="https://picsum.photos/600/900?random=1" alt="Portfolio Image 1" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/1000/600?random=2" alt="Portfolio Image 2" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/600?random=3" alt="Portfolio Image 3" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/800/1200?random=4" alt="Portfolio Image 4" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/1200/800?random=5" alt="Portfolio Image 5" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/700/700?random=6" alt="Portfolio Image 6" loading="lazy">
    </div>
  </main>

  <!-- Enlarged Image Overlay -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-content" id="lightboxImg" src="" alt="Enlarged View">
  </div>

  <footer>
    <p>&copy; 2026 Your Name. Connect on <a href="https://instagram.com" target="_blank">Instagram</a> or <a href="mailto:you@example.com">Email</a>.</p>
  </footer>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const galleryItems = document.querySelectorAll('.gallery-item img');

    // Open lightbox when clicking any gallery item
    galleryItems.forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('active');
      });
    });

    // Close lightbox when clicking the close button
    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    // Close lightbox when clicking outside the image
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
      }
    });

    // Close lightbox on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        lightbox.classList.remove('active');
      }
    });
  </script>

</body>
</html>
