<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Portfolio</title>
  <style>
    /* Dark mode, minimal aesthetics */
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --subtext-color: #a0a0a0;
      --accent-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header styling */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    header p {
      color: var(--subtext-color);
      font-size: 1rem;
    }

    /* Responsive Masonry-style Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 4px;
      background-color: #1e1e1e;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      opacity: 0.9;
    }

    /* Footer / Links */
    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #222;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Your Name</h1>
    <p>Photography & Visual Stories</p>
  </header>

  <main class="gallery">
    <!-- Replace the src links with your own image paths or URLs -->
    <div class="gallery-item">
      <img src="https://picsum.photos/600/800?random=1" alt="Portfolio Image 1" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/800/600?random=2" alt="Portfolio Image 2" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/600?random=3" alt="Portfolio Image 3" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/800/600?random=4" alt="Portfolio Image 4" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/800?random=5" alt="Portfolio Image 5" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/600?random=6" alt="Portfolio Image 6" loading="lazy">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Your Name. Connect on <a href="https://instagram.com" target="_blank">Instagram</a> or <a href="mailto:you@example.com">Email</a>.</p>
  </footer>

</body>
</html>
